
name: JEZZ PS3 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar make

      - name: Download PS3 toolchain
        run: |
          curl -fL https://cdn.hddj.top/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz -o ps3dev.tar.gz
          mkdir ps3dev
          tar -xzf ps3dev.tar.gz -C ps3dev

      - name: Configure environment
        run: |
          echo "PS3DEV=$GITHUB_WORKSPACE/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=$GITHUB_WORKSPACE/ps3dev" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/ps3dev/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/ps3dev/ppu/bin" >> $GITHUB_PATH

      - name: Build JEZZ
        run: |
          make clean
          make VERBOSE=1

      - name: Check output
        run: |
          test -f JEZZ.elf

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: JEZZ-PS3-ELF
          path: JEZZ.elf

