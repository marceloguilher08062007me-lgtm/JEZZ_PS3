name: JEZZ PS3 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar make

      - name: Download and extract PS3 toolchain
        shell: bash
        run: |
          curl -fL \
            https://cdn.hddj.top/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz \
            -o ps3dev.tar.gz
          tar -xzf ps3dev.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Configure PS3 environment
        shell: bash
        run: |
          RULES="$(find "$GITHUB_WORKSPACE" -name ppu_rules -type f -print -quit)"
          if [ -z "$RULES" ]; then
            echo "ERRO: ppu_rules não encontrado"
            exit 1
          fi

          PS3DEV="$(dirname "$RULES")"

          test -x "$PS3DEV/ppu/bin/ppu-gcc"

          echo "PS3DEV=$PS3DEV" >> "$GITHUB_ENV"
          echo "PSL1GHT=$PS3DEV" >> "$GITHUB_ENV"
          echo "PORTLIBS=$PS3DEV/portlibs/ppu" >> "$GITHUB_ENV"
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"

      - name: Verify compiler and project files
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          pwd
          ls -la
          ppu-gcc --version
          test -f "$GITHUB_WORKSPACE/Makefile"
          test -f "$GITHUB_WORKSPACE/src/main.cpp"

      - name: Build JEZZ ELF
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          make clean TARGET=JEZZ
          make TARGET=JEZZ
          test -s JEZZ.elf

      - name: Build JEZZ PKG
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          make pkg \
            TARGET=JEZZ \
            TITLE="JEZZ" \
            APPID="JEZZ00001" \
            CONTENTID="UP0001-JEZZ00001_00-0000000000000000"

          test -s JEZZ.pkg

      - name: Upload JEZZ files
        uses: actions/upload-artifact@v4
        with:
          name: JEZZ-PS3
          path: |
            JEZZ.elf
            JEZZ.pkg
          if-no-files-found: error
