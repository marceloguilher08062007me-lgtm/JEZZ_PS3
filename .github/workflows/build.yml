
name: JEZZ PS3 Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout JEZZ
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar make git wget patch autoconf automake libtool pkg-config build-essential file

      - name: Download PS3 toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ps3dev"

          TOOLCHAIN_URL="https://cdn.hddj.top/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz"
          ARCHIVE="$RUNNER_TEMP/ps3dev-92534e60-ubuntu-latest.tar.gz"
          DOWNLOADED=0

          for attempt in {1..8}; do
            echo "Download: tentativa $attempt/8"
            if wget --continue --timeout=30 --tries=3 --waitretry=5 \
              --retry-connrefused --directory-prefix="$RUNNER_TEMP" "$TOOLCHAIN_URL"; then
              if tar -tzf "$ARCHIVE" >/dev/null 2>&1; then
                DOWNLOADED=1
                break
              fi
            fi
            sleep $((attempt * 5))
          done

          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "Falha no download da toolchain."
            exit 1
          fi

          tar -xzf "$ARCHIVE" -C "$GITHUB_WORKSPACE/ps3dev"

      - name: Configure PS3 environment
        shell: bash
        run: |
          set -euo pipefail

          RULES="$(find "$GITHUB_WORKSPACE/ps3dev" -name ppu_rules -print -quit)"

          if [ -z "$RULES" ]; then
            echo "ppu_rules não encontrado."
            exit 1
          fi

          PS3DEV="$(dirname "$RULES")"
          PORTLIBS="$PS3DEV/portlibs/ppu"

          test -x "$PS3DEV/ppu/bin/ppu-gcc"

          mkdir -p "$PORTLIBS/include" "$PORTLIBS/lib"

          echo "PS3DEV=$PS3DEV" >> "$GITHUB_ENV"
          echo "PSL1GHT=$PS3DEV" >> "$GITHUB_ENV"
          echo "PORTLIBS=$PORTLIBS" >> "$GITHUB_ENV"
          echo "PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PORTLIBS/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build PolarSSL and libcurl
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/bucanero/ps3libraries.git "$RUNNER_TEMP/ps3libraries"
          cd "$RUNNER_TEMP/ps3libraries/scripts"

          cat > "$RUNNER_TEMP/jezz-polarssl-make" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/patch_polarssl_entropy.py" "$PWD/entropy_poll.c"
          exec make "$@"
          SH
          chmod +x "$RUNNER_TEMP/jezz-polarssl-make"

          MAKE="$RUNNER_TEMP/jezz-polarssl-make" bash 015-polarssl-1.3.9.sh
          bash 016-libcurl-7.64.1.sh

          test -s "$PORTLIBS/lib/libpolarssl.a"
          test -s "$PORTLIBS/lib/libcurl.a"
          test -s "$PORTLIBS/include/curl/curl.h"
          test -d "$PORTLIBS/include/polarssl"
          echo "=== VERIFICANDO POLARSSL COMPILADO ==="
          ppu-nm -A "$PORTLIBS/lib/libpolarssl.a" | grep -E 'platform_entropy_poll|sysGetRandomNumber' || true
          ppu-objdump -d "$PORTLIBS/lib/libpolarssl.a" | grep -A35 -B5 "platform_entropy_poll" | grep "sysGetRandomNumber" || true
          echo "=== FIM DA VERIFICACAO ==="

      - name: Build and install Tiny3D
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/wargio/tiny3D.git "$RUNNER_TEMP/tiny3D"

          make -C "$RUNNER_TEMP/tiny3D/lib" clean
          make -C "$RUNNER_TEMP/tiny3D/lib" install

          make -C "$RUNNER_TEMP/tiny3D/libfont" clean
          make -C "$RUNNER_TEMP/tiny3D/libfont" install

          test -s "$PORTLIBS/lib/libtiny3d.a"
          test -s "$PORTLIBS/lib/libfont3d.a"
          test -s "$PORTLIBS/include/tiny3d.h"
          test -s "$PORTLIBS/include/libfont.h"

      - name: Prepare HTTPS certificate bundle
        run: |
          set -euo pipefail
          mkdir -p pkgfiles/USRDIR
          cp /etc/ssl/certs/ca-certificates.crt pkgfiles/USRDIR/cacert.pem
          test -s pkgfiles/USRDIR/cacert.pem

      - name: Diagnose audio libraries
        shell: bash
        run: |
          set -u

          echo "========== AUDIO LIBRARIES =========="

          for lib in \
            libaudioplayer.a \
            libmad.a \
            libvorbisfile.a \
            libvorbis.a \
            libogg.a \
            libaudio.a
          do
            echo "Checking $lib"

            find "$PORTLIBS/lib" "$PSL1GHT/ppu/lib" \
              -name "$lib" -type f -print 2>/dev/null || true
          done

          echo "========== AUDIO HEADERS =========="

          find "$PORTLIBS/include" "$PSL1GHT/ppu/include" \
            -type f \( \
              -iname 'audioplayer.h' \
              -o -iname 'spu_soundlib.h' \
              -o -iname 'mad.h' \
              -o -iname 'audio.h' \
              -o -iname '*vorbis*.h' \
              -o -iname '*ogg*.h' \
            \) -print 2>/dev/null || true

          echo "========== SYMBOLS: AUDIOPLAYER =========="

          if [ -s "$PORTLIBS/lib/libaudioplayer.a" ]; then
            ppu-nm -u "$PORTLIBS/lib/libaudioplayer.a" || true
          else
            echo "libaudioplayer.a não encontrada no runner."
          fi

          echo "========== SYMBOLS: MAD =========="

          if [ -s "$PORTLIBS/lib/libmad.a" ]; then
            ppu-nm -u "$PORTLIBS/lib/libmad.a" || true
          fi

          echo "========== SYMBOLS: VORBIS =========="

          if [ -s "$PORTLIBS/lib/libvorbisfile.a" ]; then
            ppu-nm -u "$PORTLIBS/lib/libvorbisfile.a" || true
          fi

          echo "========== TOOLCHAIN =========="
          ppu-gcc --version
          ppu-nm --version

      - name: Verify JEZZ files
        run: |
          set -euo pipefail
          test -s Makefile
          test -s src/main.cpp
          test -s ICON0.PNG
          file ICON0.PNG
          ppu-gcc --version

      - name: Build JEZZ
        run: |
          set -euo pipefail
          make clean
          make
          test -s JEZZ.elf
          test -s JEZZ.self

      - name: Package JEZZ
        run: |
          set -euo pipefail
          make pkg
          test -s JEZZ.pkg

      - name: Upload JEZZ artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JEZZ-PS3
          path: |
            JEZZ.elf
            JEZZ.self
            JEZZ.pkg
          if-no-files-found: error
