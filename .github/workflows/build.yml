
name: JEZZ PS3 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar make

      - name: Download and extract PS3 toolchain
        shell: bash
        run: |
          curl -fL \
            https://cdn.hddj.top/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz \
            -o ps3dev.tar.gz

          tar -xzf ps3dev.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Configure PS3 environment
        shell: bash
        run: |
          export PS3DEV="$GITHUB_WORKSPACE/ps3dev"
          export PSL1GHT="$PS3DEV"

          if [ ! -d "$PS3DEV" ]; then
            echo "ERRO: pasta ps3dev nao encontrada"
            exit 1
          fi

          if [ ! -f "$PSL1GHT/ppu_rules" ]; then
            echo "ERRO: ppu_rules nao encontrado em $PSL1GHT"
            exit 1
          fi

          if [ ! -x "$PS3DEV/ppu/bin/ppu-gcc" ]; then
            echo "ERRO: ppu-gcc nao encontrado"
            exit 1
          fi

          echo "PS3DEV=$PS3DEV" >> "$GITHUB_ENV"
          echo "PSL1GHT=$PSL1GHT" >> "$GITHUB_ENV"
          echo "PORTLIBS=$PS3DEV/portlibs/ppu" >> "$GITHUB_ENV"

          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"

      - name: Verify project files
        shell: bash
        run: |
          test -f Makefile
          test -f src/main.c
          echo "Projeto JEZZ encontrado"

      - name: Build JEZZ ELF
        shell: bash
        run: |
          make clean
          make
          test -s JEZZ.elf

      - name: Build JEZZ PKG
        shell: bash
        run: |
          make JEZZ.pkg \
            TITLE="JEZZ" \
            APPID="JEZZ00001" \
            CONTENTID="UP0001-JEZZ00001_00-0000000000000000"

          test -s JEZZ.pkg

      - name: Upload JEZZ files
        uses: actions/upload-artifact@v4
        with:
          name: JEZZ-PS3
          path: |
            JEZZ.elf
            JEZZ.pkg
          if-no-files-found: error
