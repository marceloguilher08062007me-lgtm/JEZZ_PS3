
name: JEZZ PS3 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar make

      - name: Download PS3 toolchain
        run: |
          curl -fL https://cdn.hddj.top/ps3dev/ps3toolchain/releases/download/2026-06-09/ps3dev-92534e60-ubuntu-latest.tar.gz -o ps3dev.tar.gz
          mkdir -p ps3dev
          tar -xzf ps3dev.tar.gz -C ps3dev

      - name: Locate toolchain
        shell: bash
        run: |
          RULES="$(find "$GITHUB_WORKSPACE/ps3dev" -name ppu_rules -print -quit)"
          PPU_GCC="$(find "$GITHUB_WORKSPACE/ps3dev" -type f -path '*/ppu/bin/ppu-gcc' -print -quit)"

          if [ -z "$RULES" ] || [ -z "$PPU_GCC" ]; then
            echo "Toolchain incompleta"
            exit 1
          fi

          PSL1GHT="$(dirname "$RULES")"
          PS3DEV="$(dirname "$(dirname "$(dirname "$PPU_GCC")")")"

          echo "PSL1GHT=$PSL1GHT" >> "$GITHUB_ENV"
          echo "PS3DEV=$PS3DEV" >> "$GITHUB_ENV"
          echo "PORTLIBS=$PS3DEV/portlibs/ppu" >> "$GITHUB_ENV"
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"

      - name: Verify project files
        run: |
          test -f Makefile
          test -f src/main.c
          echo "Arquivos encontrados"

      - name: Build ELF
        run: |
          make clean
          make
          test -s JEZZ.elf

      - name: Package JEZZ
        run: |
          make JEZZ.pkg
          find . -maxdepth 2 -name '*.pkg' -type f -print

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: JEZZ-PS3-Build
          path: |
            JEZZ.elf
            JEZZ.pkg
          if-no-files-found: error
